name: Claude changelog auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  claude-changelog:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'JetBrains/ideavim' &&
      github.event.pull_request.user.login == 'claude[bot]' &&
      startsWith(github.event.pull_request.title, 'Update changelog:')
    steps:
      # Runs on every push to the PR, so auto-merge is turned off again if a later
      # commit touches anything besides the changelog.
      - name: Auto-merge Claude changelog PR
        run: |
          files=$(gh pr diff "$PR_URL" --name-only)
          if [ "$files" != "CHANGES.md" ]; then
            echo "::error::Changelog PR changes files other than CHANGES.md:"
            echo "$files"
            gh pr merge --disable-auto "$PR_URL" || true
            exit 1
          fi
          gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{github.event.pull_request.html_url}}
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
